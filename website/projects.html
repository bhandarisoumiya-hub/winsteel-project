<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure Projects Portfolio | Winsteel Engineering Works Pvt. Ltd.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body data-page="projects">

  <!-- Common Reusable Header (Loaded from js/components.js) -->
  <div id="app-header"></div>

  <!-- Page Banner -->
  <section class="page-header-banner">
    <div class="container">
      <span class="subheading">PROVEN TRACK RECORD</span>
      <h1>Projects</h1>
      <p>Discover our proven track record delivering mission-critical construction equipment for elevated metro rail viaducts, marine projects, and landmark highway bridges.</p>
    </div>
  </section>

  <!-- Filters & Dynamic Grid -->
  <section class="section-pad">
    <div class="container">
      <!-- Search Input -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="project-search" placeholder="Search projects by authority name, bridge type, or location...">
      </div>

      <!-- Category Filter Tabs -->
      <div id="project-filters" class="filter-tabs"></div>

      <!-- Dynamic Projects Grid -->
      <div id="projects-grid" class="dynamic-grid"></div>
    </div>
  </section>

  <!-- Common Reusable Footer & Modal (Loaded from js/components.js) -->
  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

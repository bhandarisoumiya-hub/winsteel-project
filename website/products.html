<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products & Equipment Showcase | Winsteel Engineering Works Pvt. Ltd.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body data-page="products">

  <!-- Common Reusable Header (Loaded from js/components.js) -->
  <div id="app-header"></div>

  <!-- Page Banner -->
  <section class="page-header-banner">
    <div class="container">
      <span class="subheading">EQUIPMENT SHOWCASE</span>
      <h1>Products</h1>
      <p>Explore our complete range of high-precision bridge launching gantries, custom steel formwork moulds, and automatic fabrication lines.</p>
    </div>
  </section>

  <!-- Filters & Dynamic Grid -->
  <section class="section-pad" style="background: var(--bg-soft); min-height: 800px;">
    <div class="container">

      <!-- Search & Status Toolbar -->
      <div class="showcase-toolbar" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; background: #ffffff; padding: 20px 26px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border-light);">
        <div class="search-box" style="position: relative; flex: 1; min-width: 280px; max-width: 480px; margin: 0 !important;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 15px;"></i>
          <input type="text" id="product-search" placeholder="Search by equipment name, specifications or category..." style="width: 100%; padding: 12px 16px 12px 44px; border: 1.5px solid #e2e8f0; border-radius: 50px; font-size: 14.5px; outline: none; transition: all 0.3s ease; color: var(--primary-navy); background: #f8fafc; margin: 0 !important;">
        </div>
        <div id="products-count" class="showcase-count" style="font-size: 14.5px; font-weight: 600; color: var(--text-muted); margin: 0 !important;">
          Showing <span style="color: var(--primary-navy); font-weight: 700;">all 26</span> Engineering Equipment Solutions
        </div>
      </div>

      <!-- Category Filter Tabs -->
      <div id="product-filters" class="filter-tabs"></div>

      <!-- Dynamic Products Grid -->
      <div id="products-grid" class="dynamic-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <!-- Common Reusable Footer & Modal (Loaded from js/components.js) -->
  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

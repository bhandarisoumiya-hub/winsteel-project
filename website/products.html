<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products & Equipment Showcase | Winsteel Engineering Works Pvt. Ltd.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body data-page="products">

  <!-- Common Reusable Header (Loaded from js/components.js) -->
  <div id="app-header"></div>

  <!-- Page Banner -->
  <section class="page-header-banner">
    <div class="container">
      <span class="subheading">EQUIPMENT SHOWCASE</span>
      <h1>Products</h1>
      <p>Explore our complete range of high-precision bridge launching gantries, custom steel formwork moulds, and automatic fabrication lines.</p>
    </div>
  </section>

  <!-- Filters & Dynamic Grid -->
  <section class="section-pad">
    <div class="container">
      <!-- Search Input -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="product-search" placeholder="Search equipment by name, load capacity, or specifications...">
      </div>

      <!-- Category Filter Tabs -->
      <div id="product-filters" class="filter-tabs"></div>

      <!-- Dynamic Products Grid -->
      <div id="products-grid" class="dynamic-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <!-- Common Reusable Footer & Modal (Loaded from js/components.js) -->
  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
